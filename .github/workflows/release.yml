name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          NOTES_FILE=$(mktemp)
          if [ -f CHANGELOG.md ] && awk "/^## \\[${VERSION#v}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md | grep -q .; then
            {
              echo "See [CHANGELOG.md](https://github.com/qpubio/qpub-go/blob/${VERSION}/CHANGELOG.md) for details."
              echo ""
              awk "/^## \\[${VERSION#v}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md
              echo ""
              echo '```bash'
              echo "go get github.com/qpubio/qpub-go@${VERSION#v}"
              echo '```'
            } > "$NOTES_FILE"
          else
            {
              echo "Go SDK release $VERSION."
              echo ""
              echo '```bash'
              echo "go get github.com/qpubio/qpub-go@${VERSION#v}"
              echo '```'
            } > "$NOTES_FILE"
          fi
          gh release create "$VERSION" --title "Release $VERSION" --notes-file "$NOTES_FILE"
